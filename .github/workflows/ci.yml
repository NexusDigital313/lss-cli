name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest -v

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        # B404 (subprocess import): we use subprocess everywhere, intentionally
        # B603 (subprocess without shell=True): we *want* shell=False, so this is OK
        # B607 (start_process_with_partial_path): paths like "iptables" are intentional, resolved via PATH at runtime
        # B108 (hardcoded /tmp): LSS *audits* /tmp, /var/tmp, /dev/shm — those paths are the
        #      subject of CIS controls (mount options, perms), not insecure temp-file usage.
        run: bandit -r lss/ -ll --skip B404,B603,B607,B108

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Smoke-test the wheel installs cleanly
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/lss --version
          /tmp/venv/bin/lss --no-color list | tail -3
